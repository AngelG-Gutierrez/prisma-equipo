services:
  db:
    image: mysql:8.0
    restart: always
    shm_size: 128mb
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    volumes:
      - './mysql_data:/var/lib/mysql'
    ports:
      - "3306:3306"
      
  app:
    build:
      context: .
    env_file:
      - .env 
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXP}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db
    ports:
      - "3000:3000"